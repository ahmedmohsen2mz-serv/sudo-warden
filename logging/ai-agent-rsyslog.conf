# ============================================================
# AI Agent Rsyslog Configuration
# File: /etc/rsyslog.d/50-ai-agent.conf
# Purpose: Centralized logging for all AI agent activities
# ============================================================

# Create a dedicated log file for ai-agent activities
# Matches the logger tag 'ai-agent' used by wrapper scripts
:programname, isequal, "ai-agent" /var/log/ai-agent/syslog.log
& stop

# Also capture sudo commands by ai-agent
:msg, contains, "ai-agent" /var/log/ai-agent/syslog.log
& stop

# Log format with full timestamp and hostname
$template AiAgentFormat,"%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n"
:programname, isequal, "ai-agent" /var/log/ai-agent/syslog-detailed.log;AiAgentFormat
