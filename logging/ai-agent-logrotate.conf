# ============================================================
# AI Agent Logrotate Configuration
# File: /etc/logrotate.d/ai-agent
# Purpose: Rotate AI agent logs to prevent disk fill
# ============================================================

/var/log/ai-agent/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        # Restart rsyslog to pick up new log files
        /usr/lib/rsyslog/rsyslog-rotate 2>/dev/null || \
        systemctl kill -s HUP rsyslog.service 2>/dev/null || true
    endscript
}

/var/log/ai-agent/sudo-io/*/* {
    weekly
    rotate 52
    compress
    missingok
    notifempty
    create 0600 root root
}
